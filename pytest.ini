[pytest]
pythonpath = .
addopts =
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --html=reports/report.html
    --self-contained-html
markers =
    booking: booking and Stripe payment flows
    stripe_fill: fills Stripe card fields (flaky on CI hosted Checkout UI)
    negative: negative / validation cases
    api: HTTP API checks
